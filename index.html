<style>
/* Standalone reset (the artifact viewer used to provide it) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.site-foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; padding-block: 20px 32px; }
.site-foot p { margin: 0 0 6px; max-width: 90ch; }
/* Layout: storefront shelves. Sticky search bar and domain rail on top, a "Today" editorial
   front page, domain aisles as filterable card grids, and a detail sheet per tool. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #121722;
  --muted: #5a6474;
  --faint: #8b94a3;
  --line: #d9dee6;
  --accent: #0b7a68;
  --accent-ink: #ffffff;
  --accent-soft: #dcefeb;
  --warn: #b5470b;
  --warn-soft: #fbe9dd;
  --bad: #b42335;
  --bad-soft: #f9e1e4;
  --good: #1d7a3e;
  --good-soft: #def2e4;
  --d-general: #4b5a70;
  --d-finance: #0f7f57;
  --d-game: #b02f6f;
  --d-web: #2357d6;
  --d-mobile: #b8650a;
  --d-design: #c2410c;
  --d-music: #7c3aed;
  --d-video: #be123c;
  --d-ideation: #0e7490;
  --d-startup: #4d7c0f;
  --shadow: 0 1px 2px rgba(18, 23, 34, .06), 0 6px 18px rgba(18, 23, 34, .06);
  --font-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", Georgia, serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1016; --surface: #151b24; --surface-2: #1b222d; --ink: #e7ebf1; --muted: #a0a9b8; --faint: #6f7a8b;
    --line: #2a3240; --accent: #35c2a6; --accent-ink: #06231d; --accent-soft: #123a33;
    --warn: #f0a46c; --warn-soft: #3a2416; --bad: #f2899a; --bad-soft: #3b1820; --good: #6fd497; --good-soft: #15301f;
    --d-general: #9aa9bf; --d-finance: #4fcf9b; --d-game: #ee79b0; --d-web: #7ea3ff; --d-mobile: #f2a54d;
    --d-design: #fb8a5a; --d-music: #b49cff; --d-video: #fb7190; --d-ideation: #4cc9e0; --d-startup: #a3d65c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1016; --surface: #151b24; --surface-2: #1b222d; --ink: #e7ebf1; --muted: #a0a9b8; --faint: #6f7a8b;
  --line: #2a3240; --accent: #35c2a6; --accent-ink: #06231d; --accent-soft: #123a33;
  --warn: #f0a46c; --warn-soft: #3a2416; --bad: #f2899a; --bad-soft: #3b1820; --good: #6fd497; --good-soft: #15301f;
  --d-general: #9aa9bf; --d-finance: #4fcf9b; --d-game: #ee79b0; --d-web: #7ea3ff; --d-mobile: #f2a54d;
  --d-design: #fb8a5a; --d-music: #b49cff; --d-video: #fb7190; --d-ideation: #4cc9e0; --d-startup: #a3d65c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; flex: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; white-space: nowrap; }
.search { flex: 1; min-width: 0; position: relative; max-width: 520px; margin-left: auto; }
.search input { width: 100%; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 0 16px 0 38px; font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--faint); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 7px; }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dc, var(--faint)); }
.tab .n { font-family: var(--font-mono); font-size: 11px; color: var(--faint); font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tab[aria-current="page"] .n { color: var(--bg); opacity: .7; }

main { padding-block: 24px 64px; }
.loading { color: var(--muted); padding: 40px 0; }

/* Today */
.today-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: end; margin-bottom: 28px; }
.date-eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.today-head h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.12; letter-spacing: -.02em; margin: 6px 0 10px; text-wrap: balance; }
.today-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.domain-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.dstat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.dstat:hover { border-color: var(--dc); }
.dstat b { font-family: var(--font-mono); font-size: 22px; font-weight: 500; color: var(--dc); font-variant-numeric: tabular-nums; line-height: 1.2; }
.dstat span { font-size: 12px; color: var(--muted); white-space: nowrap; }

.stories { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-bottom: 40px; }
.story { grid-column: span 4; position: relative; border-radius: 18px; border: 0; padding: 0; text-align: left; cursor: pointer; color: #fff; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); background: var(--sbg); }
.story.lead { grid-column: span 8; flex-direction: row; }
.story.lead.wide { grid-column: span 12; }
.story-art { aspect-ratio: 1200 / 630; max-width: 100%; position: relative; flex: none; display: grid; place-items: center; padding: 20px;
  background: radial-gradient(120% 90% at 50% 0%, rgba(255, 255, 255, .14), transparent 60%),
    linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px) 0 0 / 24px 24px; }
.art-grid { display: grid; grid-template-columns: repeat(var(--cols), var(--tile, 64px)); gap: 14px; }
.art-grid > * { width: var(--tile, 64px); height: var(--tile, 64px); border-radius: 16px; background: #fff; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff; object-fit: contain; padding: 9px; }
.art-grid > :nth-child(odd) { transform: translateY(-6px) rotate(-3deg); }
.art-grid > :nth-child(even) { transform: translateY(6px) rotate(3deg); }
.art-grid > .mono { background: rgba(255, 255, 255, .18); padding: 0; }
.story.lead .story-art { width: 50%; aspect-ratio: auto; min-height: 300px; --tile: 76px; }
.story-text { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; justify-content: flex-end; min-width: 0; }
.story .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.story h2 { font-family: var(--font-display); font-weight: 800; font-size: 23px; line-height: 1.22; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.story.lead h2 { font-size: clamp(26px, 3vw, 34px); }
.story p { margin: 0; font-size: 13.5px; opacity: .88; max-width: 52ch; }
.story:hover { transform: translateY(-2px); transition: transform .2s; }

.shelf { margin-bottom: 36px; }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.shelf-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.shelf-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; white-space: nowrap; font-size: 14px; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 280px); gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
.rail > * { scroll-snap-align: start; }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0; cursor: pointer; overflow: hidden; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--faint); box-shadow: var(--shadow); }
.shot { aspect-ratio: 1200 / 630; background: var(--surface-2); position: relative; overflow: hidden; border-bottom: 1px solid var(--line); max-width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.poster { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px 16px; color: var(--dc); background:
  linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 22px 22px,
  linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 22px 22px,
  var(--surface-2); }
.poster b { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero-shot .poster { padding: 24px 28px 48px; }
.hero-shot .poster b { font-size: clamp(22px, 4vw, 34px); }
.poster span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.card-body { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; flex: 1; }
.card-id { display: flex; align-items: flex-start; gap: 10px; position: relative; }
.card-id .icon { margin-top: -24px; }
.card-id .who { padding-top: 8px; }
.icon { width: 52px; height: 52px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); object-fit: contain; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: #fff; font-size: 18px; box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
.icon.mono { background: var(--dc); border-color: transparent; }
img.icon { padding: 6px; }
.card-id .who { min-width: 0; padding-bottom: 2px; }
.card h3 { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tagline { margin: 0; font-size: 13.5px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px; font-size: 12px; }
.fit { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fit.cost { color: var(--warn); }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; flex: none; }
.pill.official { background: var(--accent-soft); color: var(--accent); }
.pill.community, .pill.third-party { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.star { background: var(--accent); color: var(--accent-ink); }
.card.dim .shot img { filter: grayscale(1); opacity: .6; }

/* Aisle */
.aisle-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: end; margin-bottom: 18px; }
.aisle-head h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 3.6vw, 40px); margin: 0; letter-spacing: -.02em; display: flex; align-items: center; gap: 12px; }
.aisle-head h1 i { width: 12px; height: 12px; border-radius: 3px; background: var(--dc); display: inline-block; }
.aisle-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.count { font-family: var(--font-mono); color: var(--muted); font-size: 13px; white-space: nowrap; }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: thin; }
.cat { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 500; cursor: pointer; color: var(--ink); }
.cat .n { font-family: var(--font-mono); font-size: 11px; color: var(--faint); margin-left: 4px; }
.cat[aria-pressed="true"] { background: var(--dc, var(--ink)); border-color: var(--dc, var(--ink)); color: #fff; }
.cat[aria-pressed="true"] .n { color: #fff; opacity: .75; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 20px; font-size: 13.5px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); user-select: none; }
.toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.filters select { margin-left: auto; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.empty { padding: 48px 0; color: var(--muted); text-align: center; }

/* Detail sheet */
dialog.sheet { border: 0; padding: 0; margin: auto; width: min(880px, calc(100% - 24px)); max-width: calc(100% - 24px); max-height: calc(100% - 32px); border-radius: 20px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgba(0, 0, 0, .35); overflow: hidden; }
dialog.sheet::backdrop { background: rgba(8, 11, 16, .55); backdrop-filter: blur(3px); }
.sheet-scroll { max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; }
.sheet-close { position: absolute; top: 12px; right: 12px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(8, 11, 16, .6); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 18px; line-height: 1; }
.hero-shot { aspect-ratio: 1200 / 630; background: var(--surface-2); position: relative; max-width: 100%; }
.hero-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet-body { padding: 0 28px 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.sheet-body > * { min-width: 0; }
.sheet-id { display: flex; gap: 16px; align-items: flex-start; position: relative; flex-wrap: wrap; }
.sheet-id > .icon { margin-top: -36px; }
.sheet-id .who { padding-top: 12px; }
.sheet-id .actions { padding-top: 12px; }
code.inline { font-family: var(--font-mono); font-size: .9em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; word-break: break-all; }
.sheet-id .icon { width: 84px; height: 84px; border-radius: 20px; font-size: 28px; }
.sheet-id img.icon { padding: 10px; }
.sheet-id .who { flex: 1; min-width: 200px; }
.sheet-id h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sheet-id .sub { font-size: 13.5px; white-space: normal; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lede { font-size: 16.5px; margin: 0; font-weight: 500; }
.desc { margin: 0; color: var(--ink); max-width: 68ch; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.fact { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.fact dt { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; margin-bottom: 3px; }
.fact dd { margin: 0; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.fact dd.num { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.block h3 { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .03em; margin: 0 0 8px; }
.cmd { display: flex; gap: 8px; align-items: stretch; }
.cmd code { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.notes li { padding: 10px 12px 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn); font-size: 14px; }
.notes.kr li { background: var(--accent-soft); border-left-color: var(--accent); }
.sources { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 4px; }
.sources a { overflow-wrap: anywhere; }
.imgcredit { font-size: 12px; color: var(--faint); margin: 0; overflow-wrap: anywhere; }

/* Story pages */
.story-page { max-width: 860px; }
.back { margin-bottom: 18px; }
.story-page h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; letter-spacing: -.02em; margin: 6px 0 12px; text-wrap: balance; }
.story-page .intro { font-size: 17px; color: var(--muted); margin: 0 0 24px; max-width: 64ch; }
.story-page h2 { font-family: var(--font-display); font-size: 21px; margin: 30px 0 10px; }
.story-page p, .story-page li { max-width: 68ch; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.timeline li { position: relative; padding: 0 0 18px 22px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--warn); }
.timeline li.past::before { background: var(--faint); border-color: var(--faint); }
.timeline time { font-family: var(--font-mono); font-size: 13px; color: var(--warn); font-variant-numeric: tabular-nums; }
.timeline li.past time { color: var(--faint); }
.timeline b { display: block; font-size: 15px; }
.timeline span { color: var(--muted); font-size: 14px; }
.checks { padding-left: 20px; display: grid; gap: 8px; }
.story-apps { margin-top: 28px; }

@media (max-width: 900px) {
  .today-head { grid-template-columns: minmax(0, 1fr); }
  .story { grid-column: span 6; }
  .story.lead { grid-column: span 12; flex-direction: column; }
  .story.lead .story-art { width: 100%; aspect-ratio: 1200 / 630; min-height: 0; --tile: 64px; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .brand-name { display: none; }
  .domain-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .story { grid-column: span 12; }
  .sheet-body { padding: 0 18px 22px; }
  .sheet-id h2 { font-size: 22px; }
  .sheet-id .icon { width: 68px; height: 68px; }
  dialog.sheet { width: calc(100% - 16px); max-width: calc(100% - 16px); max-height: calc(100% - 16px); border-radius: 16px; }
  .sheet-scroll { max-height: calc(100vh - 16px); }
  .filters select { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .story:hover { transform: none; }
}

function renderStory() {

}

/* Detail sheet */
function openApp(id) {
  const a = BY_ID.get(id);
  if (!a) return;
  const d = DOMAINS[a.domain];
  const fact = (k, v, num) => `<div class="fact"><dt>${k}</dt><dd${num ? ' class="num"' : ''}>${v}</dd></div>`;
  const works = (a.worksWith || []).map(k => WORKS[k]).join(', ') || '—';
  const conn = (a.connect || []).map(c => CONNECT[c] || c).join(', ') || '—';
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
  const related = sortApps(APPS.filter(x => x.domain === a.domain && x.category === a.category && x.id !== a.id)).slice(0, 10);
  const sheet = $('#sheet');
  sheet.style.setProperty('--dc', d.color);
  sheet.innerHTML = `<div class="sheet-scroll">
    <button class="sheet-close" type="button" aria-label="닫기" data-close>×</button>
    ${shotHTML(a, 'hero-shot')}
    <div class="sheet-body">
      <div class="sheet-id">${iconHTML(a)}<div class="who"><h2 id="sheet-title">${esc(a.name)}</h2><div class="sub">${esc(a.vendor || '')} · ${esc(d.label)} · ${esc(a.category)}</div></div>
        <div class="actions">
          ${a.homepage ? `<a class="btn primary" href="${esc(a.homepage)}" target="_blank" rel="noopener">사이트 열기</a>` : ''}
          ${a.repo ? `<a class="btn" href="https://github.com/${esc(a.repo)}" target="_blank" rel="noopener">GitHub</a>` : ''}
          <button class="btn" type="button" data-save="${esc(a.id)}" aria-pressed="${SAVED.has(a.id)}">${SAVED.has(a.id) ? '보관됨' : '보관'}</button>
        </div></div>
      <p class="lede">${esc(a.tagline)}</p>
      <dl class="facts">
        ${fact('연결 방식', esc(conn))}
        ${fact('호환 구독·클라이언트', esc(works))}
        ${fact('AI 비용', AICOST[a.aiCost] || '—')}
        ${fact('가격', esc(a.price || '확인 필요'))}
        ${fact('제공', OFFICIAL[a.official] || '—')}
        ${fact('상태', STATUS[a.status] || '—')}
        ${fact('GitHub 스타', a.stars != null ? a.stars.toLocaleString('ko-KR') : '—', true)}
        ${fact('최근 업데이트', esc(a.updated || '—'), true)}
      </dl>
      ${a.foundVia ? `<p class="imgcredit">발견 경로: ${esc(a.foundVia)}</p>` : ''}
      <p class="desc">${rich(a.description)}</p>
      ${a.install ? `<div class="block"><h3>설치·연결</h3><div class="cmd"><code id="cmd-text">${esc(a.install)}</code><button class="btn" type="button" data-copy>복사</button></div></div>` : ''}
      ${(a.caveats || []).length ? `<div class="block"><h3>주의사항</h3><ul class="notes">${a.caveats.map(c => `<li>${rich(c)}</li>`).join('')}</ul></div>` : ''}
      ${a.korea ? `<div class="block"><h3>한국 메모</h3><ul class="notes kr"><li>${rich(a.korea)}</li></ul></div>` : ''}
      ${(a.sources || []).length ? `<div class="block"><h3>출처</h3><ol class="sources">${a.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label || host(s.url))}</a> <span class="sub">${esc(host(s.url))}</span></li>`).join('')}</ol></div>` : ''}
      ${a.img ? `<p class="imgcredit">이미지: ${IMGKIND[a.imgKind] || '공개 이미지'}${a.imgSrc ? ' · ' + esc(host(a.imgSrc)) : ''}. 아이콘과 이미지의 권리는 각 회사에 있습니다.</p>` : ''}
      ${related.length ? `<section class="shelf"><div class="shelf-head"><div><h2>같은 카테고리</h2></div></div><div class="rail">${related.map(cardHTML).join('')}</div></section>` : ''}
    </div></div>`;
  if (!sheet.open) sheet.showModal();
  $('.sheet-scroll', sheet).scrollTop = 0;
  hydrate(sheet);
}

/* Routing and events */
function render() {
  renderTabs();
  if (state.q) renderSearch();
  else if (state.view === 'domain') renderAisle();
  else if (state.view === 'saved') renderSaved();
  else if (state.view === 'sources') renderSources();
  else if (state.view === 'story') renderStory();
  else renderToday();
  const sort = $('#sort'); if (sort) sort.value = state.sort;
  hydrate($('#main'));
}
function go(tab) {
  state.q = ''; $('#q').value = '';
  if (DOMAINS[tab]) { state.view = 'domain'; if (state.domain !== tab) state.cat = null; state.domain = tab; }
  else state.view = tab;
  render(); window.scrollTo({ top: 0 });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-open],[data-story],[data-cat],[data-save],[data-copy],[data-close]');
  if (!t) return;
  if (t.dataset.close !== undefined) return $('#sheet').close();
  if (t.dataset.copy !== undefined) {
    const code = $('#cmd-text'); const text = code.textContent;
    const done = () => { t.textContent = '복사됨'; setTimeout(() => (t.textContent = '복사'), 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = '선택됨'; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
    return;
  }
  if (t.dataset.save) {
    const id = t.dataset.save;
    SAVED.has(id) ? SAVED.delete(id) : SAVED.add(id); persistSaved();
    t.setAttribute('aria-pressed', SAVED.has(id)); t.textContent = SAVED.has(id) ? '보관됨' : '보관';
    renderTabs(); if (state.view === 'saved') renderSaved();
    return;
  }
  if (t.dataset.open) return openApp(t.dataset.open);
  if (t.dataset.story) { state.view = 'story'; state.story = t.dataset.story; state.q = ''; $('#q').value = ''; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.cat !== undefined) { state.cat = t.dataset.cat || null; render(); return; }
  if (t.dataset.tab) { if ($('#sheet').open) $('#sheet').close(); go(t.dataset.tab); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.filter) { state.f[e.target.dataset.filter] = e.target.checked; render(); }
  if (e.target.id === 'sort') { state.sort = e.target.value; render(); }
});
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 140); });
$('#brand').addEventListener('click', () => go('today'));
$('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

async function boot() {
  try {
    const res = await fetch('data/catalog.json');
    APPS = await res.json();
  } catch (err) {
    $('#main').innerHTML = '<p class="empty">카탈로그 데이터를 불러오지 못했습니다. 페이지를 새로 고쳐 주세요.</p>';
    return;
  }
  BY_ID = new Map(APPS.map(a => [a.id, a]));
  const h = location.hash.slice(1);
  if (DOMAINS[h]) { state.view = 'domain'; state.domain = h; }
  else if (h === 'saved' || h === 'sources') state.view = h;
  else if (STORIES.some(s => s.id === h)) { state.view = 'story'; state.story = h; }
  render();
  if (BY_ID.has(h)) openApp(h);
}
boot();
</script>
</body>
</html>
